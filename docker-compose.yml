services:
  postgres:
    image: postgres:17-alpine
    container_name: ikbenimle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ikbenimle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ikbenimle-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-ikbenimle}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  migration:
    build:
      context: ./backend
    command: ["node", "scripts/migrate.js", "up"]
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      DB_TYPE: postgres
      DB_SERVER: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-ikbenimle}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ikbenimle-local-password}
      DB_NAME: ${POSTGRES_DB:-ikbenimle}
      DB_SSL: "false"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    container_name: ikbenimle-backend
    restart: unless-stopped
    stop_grace_period: 20s
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_TYPE: postgres
      DB_SERVER: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-ikbenimle}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ikbenimle-local-password}
      DB_NAME: ${POSTGRES_DB:-ikbenimle}
      DB_SSL: "false"
      CORS_ORIGINS: http://localhost,http://localhost:5173,https://localhost
      PUBLIC_APP_URL: http://localhost
      SCHEDULER_ENABLED: "false"
      X_ACCEL_REDIRECT_ENABLED: "true"
    volumes:
      - backend_uploads:/app/uploads
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      migration:
        condition: service_completed_successfully
    expose:
      - "5000"

  worker:
    build:
      context: ./backend
    container_name: ikbenimle-worker
    restart: unless-stopped
    command: ["node", "worker.js"]
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      DB_TYPE: postgres
      DB_SERVER: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-ikbenimle}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ikbenimle-local-password}
      DB_NAME: ${POSTGRES_DB:-ikbenimle}
      DB_SSL: "false"
      CORS_ORIGINS: http://localhost,http://localhost:5173,https://localhost
      PUBLIC_APP_URL: http://localhost
    volumes:
      - backend_uploads:/app/uploads
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ""
    container_name: ikbenimle-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - backend_uploads:/srv/uploads:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "8080"

  caddy:
    image: caddy:2.10-alpine
    container_name: ikbenimle-caddy
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  backend_uploads:
  postgres_data:
  caddy_data:
  caddy_config:
